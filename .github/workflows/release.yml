name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install tools
        run: brew install create-dmg

      - name: Test
        run: swift test

      - name: Build
        run: APP_VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="$(date +%s)" scripts/build-app.sh

      - name: Create DMG
        run: |
          DMG_NAME="TunnelDeck-${GITHUB_REF_NAME}.dmg"
          scripts/create_dmg.sh build/TunnelDeck.app "$DMG_NAME"
          shasum -a 256 "$DMG_NAME" > "${DMG_NAME}.sha256"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            ${{ env.DMG_NAME }}
            ${{ env.DMG_NAME }}.sha256
